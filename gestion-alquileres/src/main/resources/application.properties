spring.application.name=gestion-alquileres
spring.main.web-application-type=none
spring.main.banner-mode=off
spring.datasource.url=jdbc:sqlite:${app.data-dir}/alquileres.db?foreign_keys=on&busy_timeout=5000
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
logging.level.root=WARN
logging.level.com.ejemplo.alquileres=INFO
logging.file.name=${app.data-dir}/logs/app.log
logging.logback.rollingpolicy.max-file-size=5MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=200MB
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n
app.data-dir=${user.home}/.gestion-alquileres
app.seeder.enabled=false
app.alertas.dias-vencimiento=60
app.alertas.recordatorio-dias=3
app.morosidad.umbral-leve-dias=15
app.morosidad.cuotas-rojo=2
app.mora.tipo=PORCENTAJE_DIARIO
app.mora.valor=0.10
app.mora.dias-gracia=3
app.recibos.serie=R001
app.recibos.leyenda=Documento interno sin validez tributaria
app.arrendador.razon-social=INMOBILIARIA EJEMPLO S.A.C.
app.arrendador.tipo-documento=RUC
app.arrendador.documento=20601234567
app.arrendador.direccion=Av. Arequipa 1250, Lince - Lima
app.arrendador.telefono=(01) 421-5500
app.arrendador.email=contacto@alquileres.pe
app.seguridad.inactividad-minutos=15
